<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0B0D">
<meta name="description" content="BAU Riders — official motorbiking club of Bahçeşehir University. Website, Instagram and WhatsApp group in one place.">
<meta property="og:title" content="BAU Riders — Links">
<meta property="og:description" content="Website · Instagram · WhatsApp — Ride to live, live to ride.">

<title>BAU Riders — Links</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ---------- Tokens ---------- */
  :root{
    --bg:#0B0B0D;
    --surface:#1A1A1F;
    --surface-hover:#222228;
    --line:rgba(255,255,255,.10);
    --text:#F4EDE0;
    --text-2:rgba(244,237,224,.62);
    --text-3:rgba(244,237,224,.42);
    --red:#E84050;
    --red-glow:rgba(232,64,80,.35);
    --ig:#E1306C;
    --wa:#25D366;
    --radius:14px;
    --font-display:"Bebas Neue","Oswald",Impact,sans-serif;
    --font-mono:"DM Mono",ui-monospace,Menlo,monospace;
    --font-body:"Inter",system-ui,-apple-system,sans-serif;
  }

  /* ---------- Base ---------- */
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;height:100%}
  body{
    min-height:100dvh;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    display:flex;flex-direction:column;align-items:center;
    padding:
      calc(20px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(16px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
    position:relative;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(60% 40% at 50% 0%, var(--red-glow), transparent 70%),
      repeating-linear-gradient(0deg, transparent 0 46px, var(--line) 46px 47px);
    opacity:.55;
  }
  a{color:inherit;text-decoration:none}
  .wrap{
    position:relative;z-index:2;
    width:100%;max-width:440px;
    flex:1;display:flex;flex-direction:column;
  }

  /* ---------- Header ---------- */
  .card{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    margin-top:clamp(4px,2vh,20px);
  }
  .logo{
    width:min(78%, 300px);
    aspect-ratio:3155/2648;
    position:relative;
    filter:drop-shadow(0 0 28px var(--red-glow));
  }
  .logo-svg{position:absolute;inset:0;width:100%;height:100%;fill:#fff}

  h1{
    margin-top:clamp(6px,1.5vh,14px);
    font-family:var(--font-display);
    font-size:clamp(42px,11vw,56px);
    line-height:.92;letter-spacing:.03em;
    text-transform:uppercase;
  }
  h1 em{font-style:normal;color:var(--red)}
  .eyebrow{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--text-3);margin-top:10px;line-height:1.6;
  }
  .tagline{
    margin-top:8px;max-width:320px;
    font-size:14px;line-height:1.5;color:var(--text-2);
  }

  /* ---------- Links ---------- */
  .links{
    display:flex;flex-direction:column;gap:11px;
    margin-top:clamp(18px,3.5vh,34px);
  }
  .link{
    --accent:var(--red);
    display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:14px;
    padding:12px 16px 12px 12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    position:relative;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    transition:transform .18s ease, border-color .18s, background .18s, box-shadow .18s;
  }
  .link::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--accent);opacity:0;transition:opacity .18s;
  }
  @media (hover:hover){
    .link:hover{
      transform:translateY(-2px);background:var(--surface-hover);
      border-color:color-mix(in srgb, var(--accent) 45%, var(--line));
      box-shadow:0 10px 30px -14px var(--accent);
    }
    .link:hover::before{opacity:1}
    .link:hover .arrow{transform:translateX(3px);color:var(--accent)}
  }
  .link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .link:active{transform:scale(.985);background:var(--surface-hover)}
  .link:active::before{opacity:1}

  .icon{
    width:46px;height:46px;border-radius:12px;
    display:grid;place-items:center;
    background:color-mix(in srgb, var(--accent) 14%, transparent);
    color:var(--accent);
  }
  .icon svg{width:23px;height:23px;fill:currentColor}
  .label{display:flex;flex-direction:column;gap:3px;min-width:0}
  .label .name{
    font-family:var(--font-display);font-size:21px;letter-spacing:.05em;line-height:1;
    text-transform:uppercase;
  }
  .label .sub{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;
    color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .arrow{font-family:var(--font-mono);font-size:16px;color:var(--text-3);transition:transform .18s,color .18s}

  .link.apply{--accent:var(--red)}
  .link.ig{--accent:var(--ig)}
  .link.wa{--accent:var(--wa)}

  /* ---------- Footer (motto + controls + copyright) ---------- */
  footer{
    margin-top:auto;
    padding-top:clamp(18px,3.5vh,36px);
    display:flex;flex-direction:column;align-items:center;gap:12px;
    text-align:center;
  }
  .motto{
    font-family:var(--font-display);font-size:17px;letter-spacing:.14em;
    color:var(--text-3);
  }
  .motto span{color:var(--red)}
  .controls{
    width:100%;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding-top:12px;border-top:1px solid var(--line);
    font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-3);
  }
  .toggle{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:0;cursor:pointer;
    font:inherit;color:var(--text-3);letter-spacing:inherit;text-transform:inherit;
    padding:10px 2px;min-height:44px;   /* comfortable tap target */
    -webkit-tap-highlight-color:transparent;
  }
  .toggle b{font-weight:500;color:var(--text)}
  .toggle .sep{opacity:.5}
  .toggle:active,.toggle:hover{color:var(--text-2)}
  .copy{
    font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-3);line-height:1.6;
  }
  .copy a{text-transform:none}
  .copy a:hover{color:var(--text)}

  /* ---------- Short screens (e.g. small phones / landscape) ---------- */
  @media (max-height:700px){
    .logo{width:min(60%,220px)}
    .tagline{display:none}
    h1{font-size:clamp(38px,10vw,48px)}
    .link{padding:10px 14px 10px 10px}
    .icon{width:42px;height:42px}
    .links{gap:9px}
  }
  @media (max-height:660px){
    .motto{display:none}
    footer{gap:6px}
  }
  @media (max-height:580px){
    .eyebrow{display:none}
  }

  /* ---------- Intro ---------- */
  .wrap{opacity:0}
  body.ready .wrap{opacity:1}
  #intro{
    position:fixed;inset:0;z-index:50;background:var(--bg);
    display:none;
  }
  body.intro #intro{display:block}
  #intro .flare{
    position:absolute;left:50%;top:50%;width:140vmin;height:140vmin;
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, var(--red-glow), transparent 70%);
    opacity:0;animation:flare 1.4s ease-out .25s both;
  }
  #intro .intro-logo{
    position:absolute;left:50%;top:50%;
    width:min(82vw,420px);aspect-ratio:3155/2648;
    transform:translate(-50%,-50%);
    fill:#fff;overflow:visible;
    will-change:transform;
  }
  #intro .intro-logo g{transform-box:view-box}
  #intro .helmet{
    transform-origin:1584px 1900px;
    animation:helmetIn .55s cubic-bezier(.2,.7,.2,1) both;
  }
  #intro .wing-l{transform-origin:1039px 1600px;animation:wingL .85s cubic-bezier(.22,.9,.3,1.15) .35s both}
  #intro .wing-r{transform-origin:2130px 1600px;animation:wingR .85s cubic-bezier(.22,.9,.3,1.15) .35s both}
  @keyframes helmetIn{from{opacity:0;transform:scale(.82) translateY(60px)}to{opacity:1;transform:none}}
  @keyframes wingL{from{opacity:0;transform:rotate(34deg) scale(.15,.7)}40%{opacity:1}to{opacity:1;transform:none}}
  @keyframes wingR{from{opacity:0;transform:rotate(-34deg) scale(.15,.7)}40%{opacity:1}to{opacity:1;transform:none}}
  @keyframes flare{0%{opacity:0}45%{opacity:1}100%{opacity:.35}}
  /* fly to header position */
  #intro.fly .intro-logo{transition:transform .6s cubic-bezier(.4,0,.2,1)}
  #intro.fly{transition:background-color .6s ease .1s}
  #intro.fly .flare{transition:opacity .4s ease;opacity:0 !important}
  #intro.done{display:none !important}
  body.ready .logo-svg{visibility:visible}
  body.intro .logo-svg{visibility:hidden}

  /* ---------- Entrance ---------- */
  @media (prefers-reduced-motion:no-preference){
    body.ready .card,body.ready .link,body.ready footer{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
    .link:nth-child(1){animation-delay:.10s}
    .link:nth-child(2){animation-delay:.18s}
    .link:nth-child(3){animation-delay:.26s}
    footer{animation-delay:.34s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  }
</style>
</head>

<script>
  /* ---------- Intro ---------- */
  (function(){
    const body=document.body, intro=document.getElementById("intro");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let seen=false; try{ seen = sessionStorage.getItem("br-intro")==="1"; }catch(e){}
    if (reduce || seen){ body.classList.add("ready"); return; }
    body.classList.add("intro");
    try{ sessionStorage.setItem("br-intro","1"); }catch(e){}
    const finish=()=>{ intro.classList.add("done"); body.classList.remove("intro"); body.classList.add("ready"); };
    setTimeout(()=>{
      const a=intro.querySelector(".intro-logo").getBoundingClientRect();
      const t=document.querySelector(".logo").getBoundingClientRect();
      const sc=t.width/a.width;
      const dx=(t.left+t.width/2)-(a.left+a.width/2);
      const dy=(t.top+t.height/2)-(a.top+a.height/2);
      intro.querySelector(".intro-logo").style.transform=`translate(-50%,-50%) translate(${dx}px,${dy}px) scale(${sc})`;
      intro.classList.add("fly"); intro.style.backgroundColor="transparent";
      body.classList.add("ready");            /* page rises in while the logo flies up */
      setTimeout(finish, 650);
    }, 1350);
    setTimeout(finish, 3000); /* safety net */
  })();

  /* ---------- i18n ---------- */
  const T = {
    en:{
      eyebrow:"Official Motorbiking Club · Bahçeşehir University · Istanbul",
      tagline:"Students, alumni, and new riders — all welcome. Find us below.",
      apply:"Apply Now",
      applySub:"Membership application form",
      waSub:"Join the group chat",
      motto:'Ride to live. <span>Live to ride.</span>'
    },
    tr:{
      eyebrow:"Resmi Motosiklet Kulübü · Bahçeşehir Üniversitesi · İstanbul",
      tagline:"Öğrenciler, mezunlar ve yeni sürücüler — herkes davetli. Bizi aşağıda bul.",
      apply:"Başvur",
      applySub:"Üyelik başvuru formu",
      waSub:"Grup sohbetine katıl",
      motto:'Sürmek için yaşa. <span>Yaşamak için sür.</span>'
    }
  };

  const root = document.documentElement;
  /* Auto language: Turkish if the device/browser prefers Turkish, otherwise English.
     navigator.languages is a plain read-only property — no permission prompt involved.
     A manual EN/TR tap is remembered and overrides the auto choice on later visits. */
  const prefersTurkish = (navigator.languages || [navigator.language || ""])
    .some(l => /^tr\b/i.test(l));
  let lang;
  try { lang = localStorage.getItem("br-lang"); } catch(e){}
  if (lang !== "en" && lang !== "tr") lang = prefersTurkish ? "tr" : "en";
  const save = (k,v)=>{ try{ localStorage.setItem(k,v);}catch(e){} };

  function applyLang(){
    root.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el=>{
      const key = el.dataset.i18n;
      if (key === "motto") el.innerHTML = T[lang][key]; else el.textContent = T[lang][key];
    });
    document.querySelector("[data-lang-en]").outerHTML = lang==="en" ? '<b data-lang-en>EN</b>' : '<span data-lang-en>EN</span>';
    document.querySelector("[data-lang-tr]").outerHTML = lang==="tr" ? '<b data-lang-tr>TR</b>' : '<span data-lang-tr>TR</span>';
  }

  document.getElementById("langToggle").addEventListener("click", ()=>{
    lang = lang==="en" ? "tr" : "en"; save("br-lang", lang); applyLang();
  });

  document.getElementById("year").textContent = new Date().getFullYear();
  applyLang();
</script>
